name: CI Credential Asset Integrity Verification

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main

jobs:
  validate-asset-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Vector Element Assets
        run: |
          test -d elements/bases
          test -d elements/graphics
          test -d elements/ribbons
          test -d elements/shapes

      - name: Validate Catalog Schemas & Specs
        run: |
          test -s catalogs/catalog_all.json
          test -s catalogs/certificates.json
          test -s catalogs/badges.json
          test -s catalogs/transcripts.json
          test -s catalogs/training_records.json
          test -s catalogs/assessments.json
          test -s catalogs/letters.json
          test -s catalogs/extracted_elements.json
          test -s editor_specifications/blank_canvas_presets.json
          test -s editor_specifications/dynamic_attributes.json
          test -s editor_specifications/typography_and_fonts.json
          test -s editor_specifications/qr_code_specs.json
