<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slanted-Notch Recognition Badge Studio // Obsidian Cyber-Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       OBSIDIAN CYBER-GRID & TACTILE CHAMFER BADGE STUDIO
       Strict Solid Colors // Zero Glassmorphism // Imperial Purple & Pure White
       ========================================================================== */
    :root {
      /* Surfaces */
      --bg-canvas: #08090b;
      --bg-panel: #0d0e11;
      --bg-panel-secondary: #121316;
      --bg-input: #0f1012;
      --surface-purple: #4a154b;
      --plate-white: #ffffff;

      /* Continuous 1px Nested Hairline Borders */
      --border-subtle: #1e293b;
      --border-muted: #334155;
      --border-divider: #1e293b;
      --border-dark: #334155;

      /* Typography */
      --text-white: #ffffff;
      --text-primary: #f4f4f5;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      /* Accents */
      --accent-emerald: #00b67a;
      --accent-crimson: #ff0050;
      --accent-mint: #00b67a;
      --accent-mint-hover: #10b981;
      --accent-orange: #f25a38;
      --accent-success: #00b67a;
      --accent-blue: #3b82f6;

      /* Badge Swatches */
      --badge-yellow: #F3C046;
      --badge-blue: #436DF7;
      --badge-green: #10B981;
      --badge-red: #EF4444;
      --badge-purple: #8B5CF6;

      --font-main: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: "Space Grotesk", "DM Sans", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #08090b;
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.10) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 38px 38px, 38px 38px, 38px 38px;
      background-position: center top;
      color: var(--text-primary);
      font-family: var(--font-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 24px 0 80px 0;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Keyline Icons */
    .keyline-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Header Module (18px Chamfer Cut) */
    .studio-header {
      background-color: var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
      padding: 1px;
      margin-bottom: 28px;
      transition: background-color 0.15s ease;
    }

    .studio-header:hover {
      background-color: var(--border-muted);
    }

    .header-inner {
      background-color: var(--bg-panel);
      clip-path: polygon(0 0, calc(100% - 17.586px) 0, 100% 17.586px, 100% 100%, 0 100%);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .badge-icon-mark {
      width: 38px;
      height: 38px;
      background-color: var(--surface-purple);
      border: 1px solid rgba(255, 255, 255, 0.2);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 13px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      background-color: var(--bg-panel-secondary);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      letter-spacing: 0.04em;
    }

    .chip.chip-mint {
      background-color: rgba(0, 182, 122, 0.12);
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
    }

    .chip.chip-orange {
      background-color: var(--surface-purple);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Buttons (14px Chamfer Cut) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 18px;
      cursor: pointer;
      border: none;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-mint {
      background-color: var(--accent-emerald);
      color: #08090b;
    }

    .btn-mint:hover {
      background-color: var(--accent-mint-hover);
      transform: translateY(-1px);
    }

    .btn-dark {
      background-color: var(--bg-panel-secondary);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
    }

    .btn-dark:hover {
      background-color: var(--border-muted);
      color: var(--text-white);
    }

    /* Interactive Customizer Layout (18px Chamfer Cut) */
    .customizer-wrapper {
      background-color: var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
      padding: 1px;
      margin-bottom: 36px;
      transition: background-color 0.15s ease;
    }

    .customizer-wrapper:hover {
      background-color: var(--border-muted);
    }

    .customizer-layout {
      background-color: var(--bg-panel);
      clip-path: polygon(0 0, calc(100% - 17.586px) 0, 100% 17.586px, 100% 100%, 0 100%);
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
    }

    @media (max-width: 900px) {
      .customizer-layout {
        grid-template-columns: 1fr;
      }
    }

    .control-group {
      margin-bottom: 18px;
    }

    .control-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .text-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
      padding: 10px 14px;
      color: var(--text-white);
      font-family: var(--font-main);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .text-input:focus {
      border-color: var(--accent-emerald);
    }

    .color-swatch-picker {
      display: flex;
      gap: 8px;
    }

    .color-swatch-btn {
      width: 32px;
      height: 32px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .color-swatch-btn.active {
      border-color: #ffffff;
      transform: scale(1.08);
    }

    /* Crisp Pure White Display Plate for Badge Preview */
    .badge-preview-card {
      background-color: var(--plate-white);
      border: 1px solid #ffffff;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.75));
    }

    .badge-svg-box {
      width: 320px;
      max-width: 100%;
      aspect-ratio: 466 / 463;
      margin: 12px 0;
    }

    /* Gallery Section (18px Chamfer Cut) */
    .gallery-wrapper {
      background-color: var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
      padding: 1px;
    }

    .gallery-inner {
      background-color: var(--bg-panel);
      clip-path: polygon(0 0, calc(100% - 17.586px) 0, 100% 17.586px, 100% 100%, 0 100%);
      padding: 24px;
    }

    .gallery-filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-divider);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-pill {
      background-color: var(--bg-panel-secondary);
      border: 1px solid var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      padding: 5px 12px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-pill:hover {
      color: var(--text-white);
      border-color: var(--border-muted);
    }

    .filter-pill.active {
      background-color: var(--surface-purple);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .grid-badge-item {
      background-color: var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
      padding: 1px;
      transition: all 0.2s ease;
    }

    .grid-badge-item:hover {
      background-color: var(--border-muted);
      transform: translateY(-2px);
    }

    .grid-badge-item-inner {
      background-color: var(--bg-panel);
      clip-path: polygon(0 0, calc(100% - 11.586px) 0, 100% 11.586px, 100% 100%, 0 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
    }

    .badge-preview-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      cursor: pointer;
      background: #ffffff;
      padding: 8px;
      border-bottom: 1px solid var(--border-divider);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 11, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background-color: var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
      padding: 1px;
      max-width: 480px;
      width: 100%;
    }

    .modal-inner {
      background-color: var(--bg-panel);
      clip-path: polygon(0 0, calc(100% - 17.586px) 0, 100% 17.586px, 100% 100%, 0 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- SVG Keyline Icons Definition -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" fill="none"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <line x1="19" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="12 19 5 12 12 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="container">

    <!-- Top Navigation Header -->
    <header class="studio-header">
      <div class="header-inner">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="badge-icon-mark">KWD</div>
          <div>
            <div style="font-family: var(--font-display); font-size: 16px; font-weight: 900; letter-spacing: -0.03em; color: var(--text-white);">
              SLANTED-NOTCH BADGE RECOGNITION STUDIO
            </div>
            <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px;">
              OBSIDIAN CYBER-GRID // 100% UNBRANDED VECTOR ARCHITECTURE
            </div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <a href="index.html" class="btn btn-dark">
            <svg class="keyline-icon"><use href="#icon-back"/></svg>
            BACK TO CATALOG
          </a>
          <div class="chip chip-orange">
            86 MASTER BADGES
          </div>
        </div>
      </div>
    </header>

    <!-- Interactive Customizer Section -->
    <section class="customizer-wrapper">
      <div class="customizer-layout">

        <!-- Controls Column -->
        <div>
          <div style="font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text-white); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em;">
            <svg class="keyline-icon" style="color: var(--accent-emerald);"><use href="#icon-shield"/></svg>
            LIVE BADGE PARAMETERS
          </div>

          <div class="control-group">
            <label class="control-label">Primary Role / Credential Title</label>
            <input type="text" id="inputRole1" class="text-input" value="SENIOR CLOUD" oninput="updateLiveBadge()">
          </div>

          <div class="control-group">
            <label class="control-label">Secondary Role Line</label>
            <input type="text" id="inputRole2" class="text-input" value="SOLUTIONS ARCHITECT" oninput="updateLiveBadge()">
          </div>

          <div class="control-group">
            <label class="control-label">Level / Grade Number</label>
            <input type="text" id="inputLevel" class="text-input" value="IV" oninput="updateLiveBadge()">
          </div>

          <div class="control-group">
            <label class="control-label">Slanted Lower Banner Text</label>
            <input type="text" id="inputBanner" class="text-input" value="ENTERPRISE CERTIFIED" oninput="updateLiveBadge()">
          </div>

          <div class="control-group">
            <label class="control-label">Accent Swatch Token</label>
            <div class="color-swatch-picker">
              <button class="color-swatch-btn active" style="background-color: var(--badge-yellow);" onclick="setColor('#F3C046', this)"></button>
              <button class="color-swatch-btn" style="background-color: var(--badge-blue);" onclick="setColor('#436DF7', this)"></button>
              <button class="color-swatch-btn" style="background-color: var(--badge-green);" onclick="setColor('#10B981', this)"></button>
              <button class="color-swatch-btn" style="background-color: var(--badge-red);" onclick="setColor('#EF4444', this)"></button>
              <button class="color-swatch-btn" style="background-color: var(--badge-purple);" onclick="setColor('#8B5CF6', this)"></button>
            </div>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 24px;">
            <button class="btn btn-mint" onclick="downloadSvg('liveBadgeCanvas', 'recognition_badge.svg')">
              <svg class="keyline-icon"><use href="#icon-download"/></svg>
              EXPORT SVG
            </button>
            <button class="btn btn-dark" onclick="copySvgCode()">
              <svg class="keyline-icon"><use href="#icon-copy"/></svg>
              COPY SVG CODE
            </button>
          </div>
        </div>

        <!-- Live Vector Preview Plate (Crisp Pure White Display Plate) -->
        <div class="badge-preview-card">
          <div class="chip chip-mint" style="margin-bottom: 12px;">
            PURE WHITE DISPLAY PLATE
          </div>
          <div class="badge-svg-box" id="liveBadgeCanvas">
            <!-- Pure Unbranded Dynamic Slanted-Notch Recognition Badge SVG -->
            <svg viewBox="0 0 466 463" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <g transform="matrix(1 0 0 1 0 0)">
                <!-- Outer Base Diamond with Top-Right Slanted Chamfer -->
                <path d="M 233 15 L 436 100 L 410 375 L 233 445 L 56 375 L 30 100 Z" fill="#0d0e11" stroke="#1e293b" stroke-width="3"/>
                
                <!-- Inner High-Contrast Structural Shield -->
                <path d="M 233 30 L 418 108 L 394 360 L 233 425 L 72 360 L 48 108 Z" fill="#121316"/>
                <path d="M 233 30 L 418 108 L 394 360 L 233 425 L 72 360 L 48 108 Z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>

                <!-- Top Precision Crown Notch -->
                <polygon points="233,40 250,56 216,56" fill="#F3C046" id="liveCrownNotch"/>

                <!-- Center Typographic Unit -->
                <text id="liveTextRole1" x="233" y="150" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="-0.03em">
                  SENIOR CLOUD
                </text>
                <text id="liveTextRole2" x="233" y="178" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="0.04em">
                  SOLUTIONS ARCHITECT
                </text>

                <!-- Prominent Grade / Level Indicator -->
                <text id="liveTextLevel" x="233" y="270" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="82" fill="#F3C046" text-anchor="middle" letter-spacing="-0.04em">
                  IV
                </text>

                <!-- Slanted Lower Banner Ribbon (45-degree corner notches) -->
                <polygon id="liveBannerPath" points="50,332 416,332 400,378 66,378" fill="#F3C046"/>
                <text id="liveTextBanner" x="233" y="360" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="15" fill="#08090b" text-anchor="middle" letter-spacing="0.06em">
                  ENTERPRISE CERTIFIED
                </text>
              </g>
            </svg>
          </div>
          <div style="font-family: var(--font-mono); font-size: 11px; color: #64748b; margin-top: 8px;">
            DIMENSIONS: 466 x 463 PX VECTOR CANVAS
          </div>
        </div>

      </div>
    </section>

    <!-- Preset Gallery Section -->
    <section class="gallery-wrapper">
      <div class="gallery-inner">
        <div class="gallery-filter-bar">
          <div style="font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text-white); display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em;">
            <svg class="keyline-icon" style="color: var(--accent-emerald);"><use href="#icon-shield"/></svg>
            RECOGNITION BADGE ARCHIVE (86 ASSETS)
          </div>

          <div class="filter-pills" id="galleryFilterPills">
            <button class="filter-pill active" onclick="filterGallery('all', this)">All (86)</button>
            <button class="filter-pill" onclick="filterGallery('yellow', this)">Yellow</button>
            <button class="filter-pill" onclick="filterGallery('blue', this)">Blue</button>
            <button class="filter-pill" onclick="filterGallery('green', this)">Green</button>
            <button class="filter-pill" onclick="filterGallery('red', this)">Red</button>
            <button class="filter-pill" onclick="filterGallery('purple', this)">Purple</button>
          </div>
        </div>

        <div class="badges-grid" id="badgesGallery"></div>
      </div>
    </section>

  </div>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="badgeModal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-inner">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <div class="chip chip-mint" id="modalChip">BADGE SPECIMEN</div>
          <button class="btn btn-dark" style="padding: 4px 10px;" onclick="closeModal()">CLOSE</button>
        </div>
        <img id="modalImg" src="" alt="Badge Preview" style="width: 240px; height: 240px; object-fit: contain; background: #ffffff; padding: 12px; border: 1px solid var(--border-subtle);">
        <div id="modalTitle" style="font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text-white); margin-top: 14px; text-align: center;"></div>
      </div>
    </div>
  </div>

  <script>
    let currentColor = '#F3C046';
    let allBadges = [];

    function setColor(color, btn) {
      currentColor = color;
      document.querySelectorAll('.color-swatch-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateLiveBadge();
    }

    function updateLiveBadge() {
      const r1 = document.getElementById('inputRole1').value || '';
      const r2 = document.getElementById('inputRole2').value || '';
      const lvl = document.getElementById('inputLevel').value || '';
      const bnr = document.getElementById('inputBanner').value || '';

      document.getElementById('liveTextRole1').textContent = r1;
      document.getElementById('liveTextRole2').textContent = r2;
      document.getElementById('liveTextLevel').textContent = lvl;
      document.getElementById('liveTextLevel').setAttribute('fill', currentColor);

      document.getElementById('liveBannerPath').setAttribute('fill', currentColor);
      document.getElementById('liveCrownNotch').setAttribute('fill', currentColor);
      document.getElementById('liveTextBanner').textContent = bnr;
    }

    function downloadSvg(containerId, filename) {
      const container = document.getElementById(containerId);
      const svg = container.querySelector('svg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);
      source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
      const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);

      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = filename;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    function copySvgCode() {
      const container = document.getElementById('liveBadgeCanvas');
      const svg = container.querySelector('svg');
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svg);
      navigator.clipboard.writeText(source).then(() => {
        alert('Clean SVG code copied to clipboard!');
      });
    }

    async function loadCatalog() {
      try {
        const res = await fetch('catalogs/catalog_all.json');
        if (!res.ok) throw new Error('Catalog missing');
        const data = await res.json();
        allBadges = data.badge || [];
        renderGallery(allBadges);
      } catch (e) {
        console.error(e);
      }
    }

    function renderGallery(badges) {
      const container = document.getElementById('badgesGallery');
      container.innerHTML = '';

      badges.forEach(b => {
        const name = b.name.replace(/^\d+_/, '').replace(/_/g, ' ');
        const color = (b.metadata && b.metadata.color) || 'default';
        const item = document.createElement('div');
        item.className = 'grid-badge-item';
        item.setAttribute('data-color', color.toLowerCase());

        const previewUrl = `badges/previews/${b.name}_${b.id}_preview.png`;

        item.innerHTML = `
          <div class="grid-badge-item-inner">
            <img src="${previewUrl}" alt="${name}" class="badge-preview-img" loading="lazy" onclick="openModal('${previewUrl}', '${name}', '${color}')" onerror="this.style.display='none'">
            <div style="margin-top: 12px; text-align: center; width: 100%;">
              <div style="font-family: var(--font-display); font-size: 13px; font-weight: 700; text-transform: capitalize; color: var(--text-white); line-height: 1.3;">
                ${name}
              </div>
              <div style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-emerald); margin-top: 4px;">
                ${color.toUpperCase()} &bull; #${b.id.slice(0, 8)}
              </div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function filterGallery(color, btn) {
      document.querySelectorAll('#galleryFilterPills .filter-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');

      if (color === 'all') {
        renderGallery(allBadges);
      } else {
        const filtered = allBadges.filter(b => {
          const c = (b.metadata && b.metadata.color) || '';
          return c.toLowerCase().includes(color);
        });
        renderGallery(filtered);
      }
    }

    function openModal(imgUrl, title, color) {
      document.getElementById('modalImg').src = imgUrl;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalChip').textContent = color.toUpperCase() + ' BADGE';
      document.getElementById('badgeModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('badgeModal').classList.remove('active');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadCatalog();
      updateLiveBadge();
    });
  </script>
</body>
</html>
